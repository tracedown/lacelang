[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "pygments-lace"
version = "0.1.1"
description = "Pygments lexer for the Lace probe scripting language"
requires-python = ">=3.11"
dependencies = ["pygments>=2.21.0"]

[project.entry-points."pygments.lexers"]
lace = "pygments_lace:LaceLexer"
